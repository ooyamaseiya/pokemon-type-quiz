services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bullseye
    volumes:
      - ..:/workspaces/gotop:cached
      # ディレクトリではなく ca.crt 単体のみをマウントする
      - /etc/caddy/certs/ca.crt:/usr/local/share/ca-certificates/caddy-ca.crt:ro
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    command: sleep infinity
    extra_hosts:
      - "dev-infer.local:${DEV_INFER_IP}"
